[package]
name = "error500"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
hex = "0.4.3"
inertia_rs = { version = "0.4.0", default-features = false, features = ["axum"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "hostname", "webpki-roots"] }
mime_guess = "2.0.5"
object_store = { version = "0.14.2", features = ["aws"] }
rand = "0.10.3"
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.11.0", default-features = false }
sha2 = "0.11.1"
sourcemap = "9.3.2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"
