name: Image Docker

# Sur chaque tag du dépôt : tests, puis construction (amd64 + arm64, chacune sur un runner natif)
# et publication sur ghcr.io/<propriétaire>/<dépôt>.
on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  # On ne publie jamais une image dont les tests échouent.
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: error500_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Les tests créent une base temporaire par test sur cette instance.
      DATABASE_URL: mysql://root@127.0.0.1:3306/error500_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend (tests et build)
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Backend
        run: cargo test

  build:
    name: Image ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Préparation
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          # Les noms d'image doivent être en minuscules.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chaque plateforme est poussée par son empreinte seule ; le job `merge` assemble le manifeste final.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Exporter l'empreinte
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Préparation
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` n'est ajouté que pour une version stable (v1.2.3), pas pour un tag libre ou une préversion.
          flavor: latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Créer le manifeste multi-architecture
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # découpage voulu : une option `-t` par tag, un `image@digest` par plateforme
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspecter l'image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

      # GitHub ne permet pas de rendre un paquet public par l'API : à la première publication, il est privé
      # tant qu'on ne l'a pas fait une fois dans ses réglages. Ce contrôle anonyme le signale à chaque version.
      - name: Vérifier que l'image est publique
        run: |
          docker logout ghcr.io
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}" > /dev/null 2>&1; then
            echo "L'image est publique : docker pull ${IMAGE}:${{ steps.meta.outputs.version }}"
          else
            echo "::warning title=Image privée::${IMAGE} n'est pas publique. Une seule fois : https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/settings → « Change visibility » → Public."
          fi
